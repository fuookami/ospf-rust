[workspace]
resolver = "3"
members = [
    # 基础层 / Foundation
    "crates/base",
    "crates/multiarray",
    "crates/math",
    "crates/quantities",
    # 建模核心与框架 / Core and framework
    "crates/core",
    "crates/framework",
    # 核心与框架插件 / Core and framework plugins
    "crates/core-plugin/gurobi",
    "crates/core-plugin/heuristic",
    "crates/core-plugin/scip",
    "crates/framework-plugin/persistence",
    # 领域框架 / Domain frameworks
    "crates/frameworks/geometry2d",
    "crates/frameworks/bpp",
    "crates/frameworks/bpp1d",
    "crates/frameworks/bpp2d",
    "crates/frameworks/bpp3d",
    "crates/frameworks/csp1d",
    "crates/frameworks/csp2d",
    "crates/frameworks/gantt-scheduling",
    "crates/frameworks/gantt-network",
    "crates/frameworks/network-scheduling",
    # 运行时绑定 / Runtime bindings
    "crates/bindings/bridge",
    "crates/bindings/wasm",
    "crates/bindings/native",
    "crates/bindings/host",
    "crates/bindings/node",
    # 组装点 / Assembly point
    "apps/example",
]

[workspace.package]
license = "MIT"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

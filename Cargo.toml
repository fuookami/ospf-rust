[workspace]
resolver = "3"
members = [
    # 基础层 / Foundation
    "crates/base",
    "crates/multiarray",
    "crates/math",
    "crates/quantities",
    # 建模核心与框架 / Core and framework
    "crates/core",
    "crates/framework",
    # 领域插件 / Domain plugins
    "crates/plugins/geometry2d",
    "crates/plugins/bpp",
    "crates/plugins/bpp1d",
    "crates/plugins/bpp2d",
    "crates/plugins/bpp3d",
    "crates/plugins/csp1d",
    "crates/plugins/csp2d",
    "crates/plugins/gantt-scheduling",
    "crates/plugins/gantt-network",
    "crates/plugins/network-scheduling",
    # 运行时绑定 / Runtime bindings
    "crates/bindings/bridge",
    "crates/bindings/wasm",
    "crates/bindings/native",
    "crates/bindings/host",
    "crates/bindings/node",
    # 组装点 / Assembly point
    "apps/example",
]

[workspace.package]
license = "MIT"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

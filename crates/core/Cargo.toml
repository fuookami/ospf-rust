[package]
name = "ospf-rust-core"
version = "1.1.0"
edition = "2024"
description = "Operations research modeling framework - Core module"
authors = ["fuookami <wfuookami@gmail.com>"]
license = "MIT"
homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "README.md"

[dependencies]
ospf-rust-base = { path = "../base", version = "1.1.0" }
ospf-rust-math = { path = "../math", version = "1.1.0" }
ospf-rust-multiarray = { path = "../multiarray", version = "1.1.0" }

# 异步运行时 / Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"], optional = true }

# 序列化 / Serialization
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` 让 JSON 对象保持插入顺序，使会话快照的字段顺序与 Kotlin 的声明顺序一致。
# `preserve_order` keeps JSON object insertion order so session snapshots match Kotlin's declaration order.
# 无损浮点读取，并保留校验和中的原始数值文本 / Read floats losslessly and retain raw numeric text for checksums
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip", "raw_value"] }
serde_yaml_ng = "0.10.0"
toml = "0.9"

# 错误处理 / Error handling
thiserror = "2.0.20"

# 异步 trait / Async trait
async-trait = "0.1.92"

# 并发 / Concurrency
parking_lot = "0.12.5"

# 审计指纹 / Audit fingerprints
sha2 = "0.11.0"

# 类型化 Arena / Typed Arena
typed-arena = "2.0.2"

# Once cell for lazy initialization
once_cell = "1.21.4"

# 数值类型 / Numeric types
bigdecimal = "0.4.10"
libm = { version = "=0.2.16", default-features = false }
num-traits = "0.2.19"
num-rational = "0.4.2"
rand = { version = "0.10.2", optional = true }

[features]
default = []
# 兼容保留：serde 相关派生已常开，该特性不再控制依赖开关。
# Kept for compatibility: serde derives are always available now; this feature no longer gates the dependencies.
serde = []
async = ["dep:tokio"]
rand = ["dep:rand"]
nightly = []
big-rational = []
big-decimal = []

# 求解器支持 / Solver support
# 启用 Gurobi 求解器（需要安装 Gurobi 软件和许可证）
# Enable Gurobi solver (requires Gurobi software and license)
# Gurobi 后端已迁移到 `ospf-rust-core-plugin-gurobi`；核心 crate 仅保留 feature 名，
# 供测试与下游兼容，通过 dev-dependency 传递到插件 crate。
# The Gurobi backend moved to `ospf-rust-core-plugin-gurobi`; this crate keeps the feature names
# for tests and downstream compatibility, forwarding them through a dev-dependency.
gurobi = ["gurobi10"]
gurobi10 = ["ospf-rust-core-plugin-gurobi/gurobi10"]
gurobi11 = ["ospf-rust-core-plugin-gurobi/gurobi11"]
gurobi12 = ["ospf-rust-core-plugin-gurobi/gurobi12"]

# SCIP 后端已迁移到 `ospf-rust-core-plugin-scip`；核心 crate 仅保留 feature 名，
# 供测试与下游兼容，通过 dev-dependency 传递到插件 crate。
# The SCIP backend moved to `ospf-rust-core-plugin-scip`; this crate keeps the feature names
# for tests and downstream compatibility, forwarding them through a dev-dependency.
scip = ["ospf-rust-core-plugin-scip/scip"]
scip-bundled = ["scip", "ospf-rust-core-plugin-scip/scip-bundled"]
scip-from-source = ["scip", "ospf-rust-core-plugin-scip/scip-from-source"]
scip-quadratic = ["scip", "ospf-rust-core-plugin-scip/scip-quadratic"]

[dev-dependencies]
ospf-rust-core-plugin-gurobi = { path = "../core-plugin/gurobi" }
ospf-rust-core-plugin-heuristic = { path = "../core-plugin/heuristic" }
ospf-rust-core-plugin-scip = { path = "../core-plugin/scip" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0.151"

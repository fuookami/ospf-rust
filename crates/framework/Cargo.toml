[package]
name = "ospf-rust-framework"
version = "1.1.0"
edition = "2024"
description = "Operations research modeling framework - Framework module"
authors = ["fuookami <wfuookami@gmail.com>"]
license = "MIT"
homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "README.md"

[dependencies]
ospf-rust-base = { path = "../base", version = "1.1.0" }
ospf-rust-math = { path = "../math", version = "1.1.0" }
ospf-rust-multiarray = { path = "../multiarray", version = "1.1.0" }
ospf-rust-core = { path = "../core", version = "1.1.0" }

# 异步运行时 / Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"], optional = true }

# 序列化 / Serialization
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = "0.11.0"

# 错误处理 / Error handling
thiserror = "2.0.20"

# 异步 trait / Async trait
async-trait = "0.1.92"

# 并发 / Concurrency
parking_lot = "0.12.5"

# 类型化 Arena / Typed Arena
typed-arena = "2.0.2"

# Once cell for lazy initialization
once_cell = "1.21.4"

# 数值类型 / Numeric types
num-traits = "0.2.19"
num-rational = "0.4.2"

# 日志 / Logging
log = "0.4.34"

# HTTP 客户端 / HTTP client
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "ospf-rust-core/serde"]
experiment = ["serde", "dep:serde_json"]
async = ["dep:tokio", "ospf-rust-core-plugin-scip/async", "ospf-rust-core-plugin-gurobi/async"]
nightly = ["ospf-rust-core/nightly"]
big-rational = ["ospf-rust-core/big-rational"]
big-decimal = ["ospf-rust-core/big-decimal"]

# 求解器支持 / Solver support
# Gurobi 扩展与核心适配器已迁移到 `ospf-rust-core-plugin-gurobi`；framework 仅保留
# feature 名供测试与下游兼容，通过 dev-dependency 使用插件 crate。
# Gurobi extensions and the core adapter moved to `ospf-rust-core-plugin-gurobi`; framework
# keeps the feature names for tests/downstream compatibility and uses the plugin as a dev-dependency.
gurobi = ["gurobi10"]
gurobi10 = ["ospf-rust-core-plugin-gurobi/gurobi10"]
gurobi11 = ["ospf-rust-core-plugin-gurobi/gurobi11"]
gurobi12 = ["ospf-rust-core-plugin-gurobi/gurobi12"]

# SCIP 扩展与核心适配器已迁移到 `ospf-rust-core-plugin-scip`；framework 仅保留
# feature 名供测试与下游兼容，通过 dev-dependency 使用插件 crate。
# SCIP extensions and the core adapter moved to `ospf-rust-core-plugin-scip`; framework keeps
# the feature names for tests/downstream compatibility and uses the plugin as a dev-dependency.
scip = ["ospf-rust-core-plugin-scip/scip"]
scip-bundled = ["scip", "ospf-rust-core-plugin-scip/scip-bundled"]
scip-from-source = ["scip", "ospf-rust-core-plugin-scip/scip-from-source"]
scip-quadratic = ["scip", "ospf-rust-core-plugin-scip/scip-quadratic"]

# 持久化支持 / Persistence support
# 持久化支持 / Persistence support
# 各后端 translator 已迁移到 `ospf-rust-framework-plugin-persistence`；framework 保留 feature 名，
# 既用于 `PersistenceBackendFeatures` 快照，也转发到插件 dev-dependency。
# The backend translators moved to `ospf-rust-framework-plugin-persistence`; framework keeps the
# feature names both for the `PersistenceBackendFeatures` snapshot and for forwarding to the plugin
# dev-dependency.
persistence = []

# SQLx 持久化后端 / SQLx persistence backend
persistence-sqlx = ["persistence", "ospf-rust-framework-plugin-persistence/persistence-sqlx"]
persistence-sqlx-postgres = ["persistence-sqlx", "ospf-rust-framework-plugin-persistence/persistence-sqlx-postgres"]
persistence-sqlx-mysql = ["persistence-sqlx", "ospf-rust-framework-plugin-persistence/persistence-sqlx-mysql"]
persistence-sqlx-sqlite = ["persistence-sqlx", "ospf-rust-framework-plugin-persistence/persistence-sqlx-sqlite"]

# Diesel 持久化后端 / Diesel persistence backend
persistence-diesel = ["persistence", "ospf-rust-framework-plugin-persistence/persistence-diesel"]
persistence-diesel-postgres = ["persistence-diesel", "ospf-rust-framework-plugin-persistence/persistence-diesel-postgres"]
persistence-diesel-mysql = ["persistence-diesel", "ospf-rust-framework-plugin-persistence/persistence-diesel-mysql"]
persistence-diesel-sqlite = ["persistence-diesel", "ospf-rust-framework-plugin-persistence/persistence-diesel-sqlite"]

# SeaORM 持久化后端 / SeaORM persistence backend
persistence-sea-orm = ["persistence", "ospf-rust-framework-plugin-persistence/persistence-sea-orm"]

# 其他 Rust ORM/SQL 框架后端 / Other Rust ORM/SQL framework backends
persistence-toasty = ["persistence", "ospf-rust-framework-plugin-persistence/persistence-toasty"]
persistence-rbatis = ["persistence-sqlx", "ospf-rust-framework-plugin-persistence/persistence-rbatis"]
persistence-cornucopia = ["persistence", "ospf-rust-framework-plugin-persistence/persistence-cornucopia"]

# 非关系型持久化后端 / Non-relational persistence backends
persistence-mongodb = ["persistence", "serde", "dep:serde_json", "ospf-rust-framework-plugin-persistence/persistence-mongodb"]
persistence-redis = ["persistence", "serde", "dep:serde_json", "ospf-rust-framework-plugin-persistence/persistence-redis"]

# 远程求解客户端 / Remote solver client
#
# 注意：remote 模块**不依赖** `async` feature。`async` 会把求解器 trait 切换为
# 返回 future 的异步形态，一旦被 feature 统一打开，就会让 bpp3d 与 gantt 这类
# 仍按同步签名调用的下游 crate 编译失败。remote 只需要 tokio 运行时 + serde。
#
# Note: the remote module does **not** depend on the `async` feature. Enabling `async`
# switches the solver traits to a future-returning shape; once feature unification turns
# it on, downstream crates such as bpp3d and gantt — whose call sites still use the
# synchronous signature — fail to compile. remote only needs the tokio runtime and serde.
# 不启用运行时的模型与报告编解码 / Model and report codecs without a runtime.
remote-codec = ["serde", "dep:serde_json"]
remote-solver = ["dep:tokio", "remote-codec"]
remote-solver-http-reqwest = ["remote-solver", "dep:reqwest"]

[dev-dependencies]
ospf-rust-core-plugin-gurobi = { path = "../core-plugin/gurobi" }
ospf-rust-core-plugin-scip = { path = "../core-plugin/scip" }
ospf-rust-framework-plugin-persistence = { path = "../framework-plugin/persistence" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

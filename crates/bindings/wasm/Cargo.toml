[package]
name = "ospf-wasm"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Low-level wasm-bindgen bindings for the OSPF TypeScript SDK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ospf-rust-bridge = { path = "../bridge" }
ospf-rust-core = { path = "../../core", features = ["serde"] }
ospf-rust-multiarray = { path = "../../multiarray" }
ospf-rust-math = { path = "../../math" }
ospf-rust-quantities = { path = "../../quantities" }
ospf-rust-framework = { path = "../../framework", features = ["remote-codec"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
serde = "1"
bigdecimal = "0.4"
num-bigint = "0.4"
num-rational = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
ospf-rust-framework-bpp2d = { path = "../../plugins/bpp2d" }
ospf-rust-framework-csp1d = { path = "../../plugins/csp1d" }
ospf-rust-framework-csp2d = { path = "../../plugins/csp2d" }

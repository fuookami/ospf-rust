[package]
name = "ospf-rust-node"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "N-API bindings sharing the OSPF native execution engine"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
ospf-rust-bridge = { path = "../bridge" }
ospf-rust-native = { path = "../native" }
napi = { version = "2", default-features = false, features = ["napi8", "async"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[features]
default = []
gurobi10 = ["ospf-rust-native/gurobi10"]
gurobi11 = ["ospf-rust-native/gurobi11"]
gurobi12 = ["ospf-rust-native/gurobi12"]
scip = ["ospf-rust-native/scip"]
scip-bundled = ["ospf-rust-native/scip-bundled"]
scip-from-source = ["ospf-rust-native/scip-from-source"]
scip-quadratic = ["ospf-rust-native/scip-quadratic"]

[package]
name = "ospf-rust-framework-gantt-network"
version = "1.1.0"
edition = "2024"
description = "Optional resource-path bridge for Gantt column generation"
license.workspace = true
readme = "README.md"

[features]
default = []
serde = ["ospf-rust-framework/serde", "ospf-rust-framework-gantt-scheduling/serde", "ospf-rust-framework-network-scheduling/serde"]
async = ["ospf-rust-framework/async", "ospf-rust-framework-gantt-scheduling/async", "ospf-rust-framework-network-scheduling/async"]
big-decimal = ["ospf-rust-framework-gantt-scheduling/big-decimal", "ospf-rust-framework-network-scheduling/big-decimal"]
big-rational = ["ospf-rust-framework-gantt-scheduling/big-rational", "ospf-rust-framework-network-scheduling/big-rational"]
gurobi10 = ["ospf-rust-core-plugin-gurobi/gurobi10"]
gurobi11 = ["ospf-rust-core-plugin-gurobi/gurobi11"]
gurobi12 = ["ospf-rust-core-plugin-gurobi/gurobi12"]
scip = ["ospf-rust-core-plugin-scip/scip"]
scip-bundled = ["scip", "ospf-rust-core-plugin-scip/scip-bundled"]
scip-from-source = ["scip", "ospf-rust-core-plugin-scip/scip-from-source"]
scip-quadratic = ["scip", "ospf-rust-core-plugin-scip/scip-quadratic"]

[dependencies]
ospf-rust-framework = { path = "../../framework", version = "1.1.0" }
ospf-rust-framework-gantt-scheduling = { path = "../gantt-scheduling", version = "1.1.0" }
ospf-rust-framework-network-scheduling = { path = "../network-scheduling", version = "1.1.0" }

[dev-dependencies]
ospf-rust-core-plugin-gurobi = { path = "../../core-plugin/gurobi", version = "1.1.0" }
ospf-rust-core-plugin-scip = { path = "../../core-plugin/scip", version = "1.1.0" }

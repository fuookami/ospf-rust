[package]
name = "ospf-rust-example"
version = "1.1.0"
edition = "2024"
license.workspace = true
description = "Examples for the ospf-rust optimization modeling framework."
homepage = "https://github.com/fuookami/ospf-rust"
repository = "https://github.com/fuookami/ospf-rust"
readme = "README.md"

[features]
default = ["demo5-offline"]
demo4-offline = [
    "dep:ospf-rust-framework-gantt-network",
    "dep:ospf-rust-framework-network-scheduling",
]
demo4-gurobi-cg = [
    "demo4-offline",
    "dep:ospf-rust-core-plugin-gurobi",
    "ospf-rust-core-plugin-gurobi/gurobi10",
]
demo5-offline = ["dep:ospf-rust-framework-network-scheduling"]
backend-gurobi = [
    "demo4-offline",
    "demo5-offline",
    "dep:ospf-rust-core-plugin-gurobi",
    "ospf-rust-core-plugin-gurobi/gurobi10",
]
demo5-gurobi-bp = [
    "demo5-offline",
    "dep:ospf-rust-core-plugin-gurobi",
    "ospf-rust-core-plugin-gurobi/gurobi10",
]
demo5-scip-bp = [
    "demo5-offline",
    "dep:ospf-rust-core-plugin-scip",
]

[dependencies]
ospf-rust-core = { path = "../../crates/core", version = "1.1.0" }
ospf-rust-framework = { path = "../../crates/framework", version = "1.1.0" }
ospf-rust-base = { path = "../../crates/base", version = "1.1.0" }
ospf-rust-math = { path = "../../crates/math", version = "1.1.0" }
ospf-rust-multiarray = { path = "../../crates/multiarray", version = "1.1.0" }
ospf-rust-framework-csp1d = { path = "../../crates/frameworks/csp1d", version = "1.1.0" }
ospf-rust-framework-bpp = { path = "../../crates/frameworks/bpp", version = "1.1.0" }
ospf-rust-framework-bpp1d = { path = "../../crates/frameworks/bpp1d", version = "1.1.0" }
ospf-rust-framework-bpp2d = { path = "../../crates/frameworks/bpp2d", version = "1.1.0" }
ospf-rust-framework-geometry2d = { path = "../../crates/frameworks/geometry2d", version = "1.1.0" }
ospf-rust-framework-gantt-scheduling = { path = "../../crates/frameworks/gantt-scheduling", version = "1.1.0" }
ospf-rust-quantities = { path = "../../crates/quantities", version = "1.1.0" }
ospf-rust-framework-network-scheduling = { path = "../../crates/frameworks/network-scheduling", version = "1.1.0", optional = true }
ospf-rust-framework-gantt-network = { path = "../../crates/frameworks/gantt-network", version = "1.1.0", optional = true }
ospf-rust-core-plugin-gurobi = { path = "../../crates/core-plugin/gurobi", version = "1.1.0", optional = true }
ospf-rust-core-plugin-scip = { path = "../../crates/core-plugin/scip", version = "1.1.0", optional = true }
time = { version = "0.3.55", features = ["std", "macros"] }

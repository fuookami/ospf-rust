[package]
name = "ospf-rust-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Authenticated loopback HTTP host for OSPF native execution"

[dependencies]
ospf-rust-bridge = { path = "../ospf-rust-bridge" }
ospf-rust-native = { path = "../ospf-rust-native" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
serde_json = "1"

[dev-dependencies]
ospf-rust-core = { path = "../ospf-rust-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time"] }
tower = { version = "0.5", features = ["util"] }

[features]
default = []
gurobi10 = ["ospf-rust-native/gurobi10"]
gurobi11 = ["ospf-rust-native/gurobi11"]
gurobi12 = ["ospf-rust-native/gurobi12"]
scip = ["ospf-rust-native/scip"]
scip-bundled = ["ospf-rust-native/scip-bundled"]
scip-from-source = ["ospf-rust-native/scip-from-source"]
scip-quadratic = ["ospf-rust-native/scip-quadratic"]
